<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>NyayVaani - Court Order Voice AI & Document Reader</title>
    
    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#4F46E5" />
    <meta name="description" content="Read Indian court orders, isolate judge directions, and talk directly to NyayVaani Voice AI." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- iOS / Safari Mobile Capable -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NyayVaani" />
  </head>
  <body class="bg-[#F8FAFC] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('NyayVaani PWA ServiceWorker registered successfully:', reg.scope);
          }).catch((err) => {
            console.warn('PWA ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
