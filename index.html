<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>NyayVaani - Court Order Voice AI & Document Reader</title>
    
    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Read Indian court orders, isolate judge directions, and talk directly to NyayVaani Voice AI." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- iOS / Safari Mobile Capable -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NyayVaani" />
  </head>
  <body class="bg-[#F8FAFC] antialiased">
    <div id="root"></div>
    <script>
      window.setTimeout(() => {
        const root = document.getElementById('root');
        if (root && root.childElementCount === 0) {
          root.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;background:#f8fafc;font-family:system-ui,sans-serif;padding:24px"><section style="max-width:520px;text-align:center;background:white;border:1px solid #cbd5e1;border-radius:20px;padding:32px"><h1 style="margin:0 0 12px;font-size:24px">NyayVaani could not start</h1><p style="margin:0 0 20px;color:#475569;line-height:1.6">The page did not finish loading. Please check your connection and try again.</p><button onclick="window.location.reload()" style="border:0;border-radius:12px;background:#000;color:#fff;font-weight:700;padding:12px 20px;cursor:pointer">Reload NyayVaani</button></section></main>';
        }
      }, 6000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then((reg) => {
            reg.update().catch(() => undefined);
            console.log('NyayVaani PWA ServiceWorker registered successfully:', reg.scope);
          }).catch((err) => {
            console.warn('PWA ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
